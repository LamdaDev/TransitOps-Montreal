services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transitops
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitops -d transitops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://transitops:transitops@postgres:5432/transitops?sslmode=disable
      PORT: 8080
      DATA_PROVIDER: mock
      INGEST_INTERVAL_SECONDS: 10
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_GRAPHQL_URL: http://localhost:8080/graphql
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
